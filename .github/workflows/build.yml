name: Build OpenWrt Kernel for MT7981

on:
  workflow_dispatch: # 仅手动触发
  push:
    branches: [main]

env:
  # 源码仓库：使用为 MT798x 深度优化的分支（推荐）
  REPO_URL: https://github.com/hanwckf/immortalwrt-mt798x
  REPO_BRANCH: main
  
  # 你的设备型号（OpenWrt 识别的 DTS 兼容性字符串）
  DEVICE_COMPATIBLE: zbtlink,zbt-z8102ax

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    # 启用缓存以显著加速后续编译
    strategy:
      cache:
        paths:
          - openwrt/dl/
          - openwrt/build_dir/

    steps:
      # 步骤1：检出本仓库代码（获取你上传的 .config 文件）
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 步骤2：准备 OpenWrt 编译环境与源码
      - name: Prepare & Build OpenWrt
        run: |
          # 2.1 克隆源码（浅克隆以节省时间和空间）
          echo "正在克隆源码仓库..."
          git clone --depth=1 ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} openwrt
          cd openwrt
          
          # 2.2 应用自定义内核配置文件
          echo "应用内核配置文件..."
          if [ -f "../.config" ]; then
            cp ../.config .config
            echo "自定义 .config 文件已应用。"
          else
            echo "警告：未在仓库根目录找到 .config 文件，将使用源码默认配置。"
            # 你可以在此处替换为获取基础配置的命令，例如：
            # cp ./defconfig/mt7981-ax3000.config .config
          fi
          
          # 2.3 更新并安装软件包源（feeds）
          echo "更新并安装 feeds..."
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 2.4 准备配置并下载依赖
          echo "准备编译配置..."
          make defconfig
          echo "下载编译依赖..."
          make download -j$(nproc) || make download -j1 V=s
          
          # 2.5 开始核心编译（通过环境变量指定目标设备）
          echo "开始内核编译，目标设备: ${{ env.DEVICE_COMPATIBLE }}"
          make -j$(nproc) V=s TARGET_SUBTARGET="mt7981" DEVICE_MODEL="${{ env.DEVICE_COMPATIBLE }}" || make -j1 V=s TARGET_SUBTARGET="mt7981" DEVICE_MODEL="${{ env.DEVICE_COMPATIBLE }}"
          
          echo "编译流程已完成！"

      # 步骤3：从编译产物中提取内核镜像文件
      - name: Extract Kernel Image
        run: |
          cd openwrt/bin/targets/mediatek/filogic/
          echo "正在在内核镜像文件..."
          # 查找内核文件，常见命名格式
          KERNEL_FILE=$(find . -name "*kernel*.bin" -o -name "*boot*.img" | head -n 1)
          
          if [ -n "$KERNEL_FILE" ]; then
            echo "找到内核文件: $KERNEL_FILE"
            cp "$KERNEL_FILE" ./kernel-mt7981-custom.bin
            echo "内核文件已提取并重命名为: kernel-mt7981-custom.bin"
            ls -lh ./kernel-mt7981-custom.bin
          else
            echo "错误：未在编译产物中找到内核文件！"
            echo "当前目录内容："
            find . -type f | head -20
            exit 1
          fi

      # 步骤4：将提取出的内核文件上传为工作流产物，供下载
      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mt7981-kernel
          path: openwrt/bin/targets/mediatek/filogic/kernel-mt7981-custom.bin
          if-no-files-found: error
          retention-days: 7
